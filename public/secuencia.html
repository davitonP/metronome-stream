<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secuencias de Audio</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@justinribeiro/lite-youtube@1/lite-youtube.min.js"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        .blob-1 { animation: float 8s ease-in-out infinite; }
        .blob-2 { animation: float 10s ease-in-out infinite 2s; }
        .blob-3 { animation: float 12s ease-in-out infinite 4s; }
        #songs-list li {
            transition: all 0.2s ease;
        }
        #songs-list li.selected {
            background: rgba(34, 211, 238, 0.14);
            border-color: rgba(34, 211, 238, 0.4);
            color: #f8fafc;
        }
        @keyframes count-pop {
            0%   { transform: scale(0.4); opacity: 0; }
            30%  { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        #countdown-overlay[data-active="true"] .countdown-number {
            animation: count-pop 0.35s ease-out both;
        }
        .control-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border-radius: 9999px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.9);
            padding: 0.55rem 0.8rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #e2e8f0;
            transition: all 0.2s ease;
        }
        .control-chip:hover {
            border-color: rgba(34, 211, 238, 0.35);
            background: rgba(30, 41, 59, 0.95);
            color: #f8fafc;
        }
        .control-chip[data-active="true"] {
            border-color: rgba(34, 211, 238, 0.45);
            background: rgba(8, 145, 178, 0.2);
            color: #f8fafc;
            box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.18);
        }
        .chip-dot {
            height: 0.6rem;
            width: 0.6rem;
            border-radius: 9999px;
            background: currentColor;
            opacity: 0.8;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans">
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="blob-1 absolute -top-32 -left-32 h-[500px] w-[500px] rounded-full bg-cyan-500/8 blur-3xl"></div>
        <div class="blob-2 absolute top-1/3 right-0 h-[400px] w-[400px] rounded-full bg-violet-500/8 blur-3xl"></div>
        <div class="blob-3 absolute bottom-0 left-1/3 h-[350px] w-[350px] rounded-full bg-emerald-500/6 blur-3xl"></div>
    </div>

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-950/70 z-40 hidden lg:hidden"></div>

    <div id="countdown-overlay" data-active="false" class="pointer-events-none fixed inset-0 z-50 hidden items-center justify-center">
        <span class="countdown-number text-[12rem] font-black leading-none text-cyan-300 drop-shadow-[0_0_40px_rgba(34,211,238,0.7)]"></span>
    </div>

    <div class="flex min-h-screen flex-col">
        <div class="flex flex-1 items-stretch px-4 py-6 sm:px-6 lg:px-8 lg:py-8">
            <div class="flex w-full flex-col gap-6 rounded-2xl border border-slate-800/80 bg-slate-900/80 p-6 shadow-2xl shadow-slate-950/60 backdrop-blur-xl lg:flex-row lg:p-8">
                <button id="menu-toggle" class="fixed top-4 left-4 z-50 lg:hidden rounded-2xl border border-slate-700/70 bg-slate-900/90 p-2 text-slate-100 shadow-lg">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>

                <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 flex w-[320px] flex-col border-r border-slate-800/80 bg-slate-950/95 shadow-2xl shadow-slate-950/60 backdrop-blur-xl transition-transform duration-300 ease-in-out -translate-x-full lg:static lg:w-[320px] lg:translate-x-0 lg:rounded-2xl lg:border lg:bg-slate-950/70">
                    <div class="flex items-center justify-between border-b border-slate-800/80 px-6 py-5">
                        <div>
                            <p class="text-[0.7rem] uppercase tracking-[0.3em] text-cyan-300/60">Toolkit Music</p>
                            <h1 class="mt-2 text-2xl font-semibold text-white">Secuencias</h1>
                        </div>
                        <button id="sidebar-close" class="rounded-xl border border-slate-700/70 p-2 text-slate-300 hover:bg-slate-800/80 lg:hidden">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>

                    <div class="flex-1 overflow-y-auto p-6">
                        <div class="rounded-2xl border border-slate-800/80 bg-slate-900/70 p-4">
                            <p class="text-[0.7rem] uppercase tracking-[0.3em] text-slate-500">Canciones disponibles</p>
                            <ul id="songs-list" class="mt-4 space-y-2"></ul>
                        </div>
                    </div>
                </aside>

                <main class="flex-1 overflow-y-auto">
                    <div class="flex flex-col gap-5">
                        <section class="rounded-2xl border border-slate-800/80 bg-slate-950/70 p-6 shadow-[0_30px_80px_-40px_rgba(15,23,42,0.8)]">
                            <div class="flex flex-col gap-8 lg:flex-row lg:items-start lg:justify-between">
                                <div class="max-w-2xl">
                                    <p class="text-[0.7rem] uppercase tracking-[0.35em] text-cyan-300/60">Canción seleccionada</p>
                                    <h2 id="song-title" class="mt-3 text-3xl font-semibold text-white sm:text-4xl">Cuan  es Dios</h2>
                                    <p id ="song-artist" class="mt-2 text-sm text-slate-400">En espíritu y en verdad</p>
                                    <div class="mt-6 grid gap-3 sm:grid-cols-3">
                                        <div class="rounded-xl border border-slate-800/70 bg-slate-900/60 p-4">
                                            <p class="text-[0.65rem] uppercase tracking-[0.2em] text-slate-500">Tempo</p>
                                            <p id="song-tempo" class="mt-2 text-base font-semibold text-cyan-300">72 BPM</p>
                                        </div>
                                        <div class="rounded-xl border border-slate-800/70 bg-slate-900/60 p-4">
                                            <p class="text-[0.65rem] uppercase tracking-[0.2em] text-slate-500">Tonalidad</p>
                                            <p id="song-key" class="mt-2 text-base font-semibold text-violet-300">C</p>
                                        </div>
                                        <div class="rounded-xl border border-slate-800/70 bg-slate-900/60 p-4">
                                            <p class="text-[0.65rem] uppercase tracking-[0.2em] text-slate-500">Compás</p>
                                            <p id="song-time signature" class="mt-2 text-base font-semibold text-emerald-300">4/4</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="w-full max-w-xs flex-shrink-0 overflow-hidden rounded-2xl border border-slate-800/70 bg-slate-900/60 shadow-xl shadow-slate-950/30 sm:max-w-sm">
                                    <lite-youtube id="song-video" videoid="drFvhcWYS3U" params="enablejsapi=1" class="aspect-video w-full"></lite-youtube>
                                </div>
                            </div>

                            <div class="mt-6 grid gap-4 ">
                                <div id="controls" class="rounded-2xl border border-slate-800/80 bg-slate-900/80 p-4">
                                    <div class="flex flex-wrap items-center gap-2 pb-4">
                                        <button id="timeline-replay" type="button" aria-label="Volver al inicio" class="inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-full border border-slate-600/60 bg-slate-800 text-slate-100 transition hover:bg-slate-700">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                                                <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                                                <path d="M3 3v5h5"></path>
                                            </svg>
                                        </button>
                                        <button id="timeline-play" type="button" aria-label="Reproducir" class="inline-flex h-16 w-16 shrink-0 items-center justify-center rounded-full border border-cyan-300/40 bg-cyan-500 text-slate-950 shadow-[0_0_28px_-4px_rgba(34,211,238,0.8)] transition hover:bg-cyan-400">
                                            <svg data-play-icon viewBox="0 0 24 24" fill="currentColor" class="h-8 w-8"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14Z"/></svg>
                                            <svg data-pause-icon viewBox="0 0 24 24" fill="currentColor" class="hidden h-8 w-8"><path d="M9 4a1 1 0 0 1 1 1v14a1 1 0 0 1-2 0V5a1 1 0 0 1 1-1Zm6 0a1 1 0 0 1 1 1v14a1 1 0 0 1-2 0V5a1 1 0 0 1 1-1Z"/></svg>
                                        </button>
                                        <button type="button" class="control-chip" data-toggle="metronome" data-active="false" aria-pressed="false">
                                            <span class="chip-dot"></span>
                                            <span>Metronomo</span>
                                        </button>
                                        <button type="button" class="control-chip" data-toggle="video" data-active="true" aria-pressed="true">
                                            <span class="chip-dot"></span>
                                            <span>Video</span>
                                        </button>
                                        <button type="button" class="control-chip" data-toggle="video-volume" data-active="true" aria-pressed="true">
                                            <span class="chip-dot"></span>
                                            <span>Vol video</span>
                                        </button>
                                        <button type="button" class="control-chip" data-toggle="lyrics" data-active="false" aria-pressed="false">
                                            <span class="chip-dot"></span>
                                            <span>Letra</span>
                                        </button>
                                        <button type="button" class="control-chip" data-toggle="loop" data-active="false" aria-pressed="false">
                                            <span class="chip-dot"></span>
                                            <span>Loop</span>
                                        </button>
                                        <button type="button" class="control-chip" data-toggle="markers" data-active="false" aria-pressed="false">
                                            <span class="chip-dot"></span>
                                            <span>Marcador</span>
                                        </button>
                                    </div>
                                    <div id="lyrics-panel" class="mt-2 hidden rounded-2xl border border-slate-800/80 bg-slate-900/70 p-4 text-sm text-slate-400">
                                        <p class="text-[0.65rem] uppercase tracking-[0.2em] text-slate-500">Letra</p>
                                        <p class="mt-2">La letra de la canción aparecerá aquí cuando la actives.</p>
                                    </div>
                                    <div id="timeline-sections" class="flex flex-wrap items-center gap-2"></div>
                                </div>
                            </div>
                        </section>

                        <div id="song-timeline-root"></div>
                    </div>
                </main>
            </div>
        </div>

        <footer class="px-6 pb-4 text-center">
            <p class="text-[0.6rem] uppercase tracking-[0.3em] text-slate-700">Toolkit Music · hecho para bandas</p>
        </footer>
    </div>
    <script src="/assets/js/canciones.js"></script>
    <script>
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menu-toggle');
        const sidebarClose = document.getElementById('sidebar-close');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const songVideo = document.getElementById('song-video');
        const lyricsPanel = document.getElementById('lyrics-panel');

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }

        document.querySelectorAll('[data-toggle]').forEach((button) => {
            button.addEventListener('click', () => {
                const isActive = button.dataset.active === 'true';
                const nextActive = !isActive;
                button.dataset.active = String(nextActive);
                button.setAttribute('aria-pressed', String(nextActive));

                switch (button.dataset.toggle) {
                    case 'video':
                        songVideo.classList.toggle('hidden', !nextActive);
                        break;
                    case 'lyrics':
                        lyricsPanel.classList.toggle('hidden', !nextActive);
                        break;
                    case 'video-volume':
                        button.querySelector('span:last-child').textContent = nextActive ? 'Vol video' : 'Silenciar';
                        break;
                    default:
                        break;
                }
            });
        });

        menuToggle.addEventListener('click', openSidebar);
        sidebarClose.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
    </script>
</body>
</html>
